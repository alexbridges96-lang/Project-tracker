<title>Stagegate Project Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">

<div class="app">
  <aside class="rail" id="rail" aria-label="Projects and navigation"></aside>
  <div class="main">
    <header class="capture" role="search">
      <label for="qc" class="capture-label">Quick capture</label>
      <div class="capture-row">
        <input id="qc" type="text" autocomplete="off" spellcheck="false"
          placeholder="r: supplier may slip p4 i3 @sam   ·   a: send PID to board due:fri   ·   press / to focus">
        <button class="btn primary" id="qc-add" type="button">Add</button>
      </div>
      <div class="capture-hint" id="qc-hint"></div>
    </header>
    <main id="view" tabindex="-1">
      <div class="empty-state"><p>Loading your projects…</p></div>
    </main>
  </div>
</div>
<div class="drawer-scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog"></aside>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="core.js"></script>
<script src="app.js"></script>
